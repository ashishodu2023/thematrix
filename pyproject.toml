[project]
name = "the-matrix"
version = "0.2.0"
description = "The Matrix as a cinematic LangGraph multi-agent simulation (Ollama)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-checkpoint-redis>=0.5.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
matrix-jack-in = "matrix.start_driver:main"
matrix-resume = "matrix.resume_driver:main"
matrix-redis = "matrix.utils.redis_explorer:main"
matrix-daemon = "matrix.daemon:main"
matrix-pull-brains = "matrix.pull_brains:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "ollama: tests that require a running Ollama server",
]
